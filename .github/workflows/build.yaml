name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: krech-et/kse-labs-trusted-workflows/.github/workflows/go-ci.yaml@main
    secrets: inherit
    with:
      go-version: '1.21'
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi      
